name: PetClinic CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  JAVA_VERSION: "21"

jobs:
  build:

    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: application/spring-petclinic-microservices/**/pom.xml

      - name: Verify environment
        run: |
          echo "Git commit: $GITHUB_SHA"
          java -version
          docker --version
          ./mvnw --version
        working-directory: application/spring-petclinic-microservices

      - name: Build and Test application
        run: ./mvnw clean verify
        working-directory: application/spring-petclinic-microservices

      - name: Build Docker images
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          DOCKERFILE="$(pwd)/docker/Dockerfile"

          services=(
            "spring-petclinic-config-server:petclinic-config:8888"
            "spring-petclinic-discovery-server:petclinic-discovery:8761"
            "spring-petclinic-customers-service:petclinic-customers:8081"
            "spring-petclinic-visits-service:petclinic-visits:8082"
            "spring-petclinic-vets-service:petclinic-vets:8083"
            "spring-petclinic-api-gateway:petclinic-gateway:8080"
            "spring-petclinic-admin-server:petclinic-admin:9090"
          )

          for entry in "${services[@]}"; do
            IFS=':' read -r service_dir image_name port <<< "$entry"

            target_dir="application/spring-petclinic-microservices/${service_dir}/target"

            jar_file=$(find "$target_dir" \
              -maxdepth 1 \
              -name "*.jar" \
              ! -name "*.original" \
              | head -1)

            if [ -z "$jar_file" ]; then
              echo "ERROR: JAR not found for ${service_dir}"
              exit 1
            fi

            jar_name=$(basename "$jar_file" .jar)

            echo "======================================"
            echo "Building ${image_name}:${IMAGE_TAG}"
            echo "JAR: ${jar_name}.jar"
            echo "Port: ${port}"
            echo "======================================"

            docker build \
              -f "$DOCKERFILE" \
              --build-arg ARTIFACT_NAME="$jar_name" \
              --build-arg EXPOSED_PORT="$port" \
              -t "${image_name}:${IMAGE_TAG}" \
              "$target_dir"
          done

          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" \
            | grep petclinic

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

          trivy --version


      - name: Scan Docker images
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::7}"

          services=(
            config
            discovery
            customers
            visits
            vets
            gateway
            admin
          )

          for service in "${services[@]}"; do
            echo "Scanning petclinic-${service}:${IMAGE_TAG}"

            trivy image \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --ignore-unfixed \
              "petclinic-${service}:${IMAGE_TAG}"
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::134163282485:role/GitHubActions-ProductionEKSPlatform
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity
