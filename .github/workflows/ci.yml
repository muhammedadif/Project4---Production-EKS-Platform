name: PetClinic CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  JAVA_VERSION: "21"

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: application/spring-petclinic-microservices/**/pom.xml

      - name: Verify environment
        run: |
          echo "Git commit: $GITHUB_SHA"
          java -version
          docker --version
          ./mvnw --version
        working-directory: application/spring-petclinic-microservices

      - name: Build and Test application
        run: ./mvnw clean verify
        working-directory: application/spring-petclinic-microservices
